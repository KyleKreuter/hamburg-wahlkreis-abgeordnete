name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Wöchentlich (Montag früh) aktuelle Abgeordnetendaten laden und neu deployen
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Abgeordnetendaten aktualisieren
        # Schlägt der Abruf fehl, wird der eingecheckte Datenstand verwendet.
        continue-on-error: true
        run: npm run update-data

      - name: Seite bauen
        run: npm run build

      - name: Auf gh-pages veröffentlichen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
