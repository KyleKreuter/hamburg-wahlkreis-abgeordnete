name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Wöchentlich (Montag früh) aktuelle Abgeordnetendaten laden und neu deployen
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abgeordnetendaten aktualisieren
        # Schlägt der Abruf fehl, wird der eingecheckte Datenstand verwendet.
        continue-on-error: true
        run: node scripts/update-data.mjs

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
